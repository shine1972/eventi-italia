name: Aggiorna eventi

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Sincronizza con remote
        run: |
          git fetch origin
          git reset --hard origin/main
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installa dipendenze
        run: pip install -r scraper/requirements.txt
      - name: Esegui scraper
        run: python scraper/scrape.py
      - name: Commit aggiornamento
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/events.json
          if git diff --cached --quiet; then
            echo "Nessun cambiamento"
          else
            git commit -m "chore: aggiorna eventi $(date -u +%F)"
            git push
          fi

    deploy:
    needs: scrape
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Inserisci chiavi API
        run: |
          sed -i 's#__GOOGLE_API_KEY__#${{ secrets.GOOGLE_API_KEY }}#g' app.js
          sed -i 's#__GOOGLE_CX__#${{ secrets.GOOGLE_CX }}#g' app.js
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
